name: Android companion build

on:
  push:
    branches: [main]
    paths: ['companion/**', '.github/workflows/companion-build.yml']
  pull_request:
    paths: ['companion/**', '.github/workflows/companion-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: gradle -p companion assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cuteOS-Companion-APK
          path: companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
